<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventFlow forest composition test</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07182d;color:#eaf2f7;font:14px system-ui}main{min-height:100vh;display:grid;place-items:center;padding:24px}.stage{width:min(100%,1100px);aspect-ratio:16/10;position:relative;overflow:hidden;border:1px solid #456;border-radius:12px;isolation:isolate;background:#102b42}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.far{animation:drift 34s ease-in-out infinite alternate;transform-origin:center}.near{animation:near 24s ease-in-out infinite alternate}.snow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 20%,#fff9 50%,transparent 60%),radial-gradient(1px 1px at 68% 38%,#fff9 50%,transparent 60%),radial-gradient(2px 2px at 83% 76%,#fff8 50%,transparent 60%);background-size:170px 190px,230px 260px,310px 280px;animation:fall 16s linear infinite}.note{position:fixed;bottom:10px;left:12px;color:#cbd9e3a8;font-size:11px}@keyframes drift{to{transform:scale(1.055) translateY(-1.2%)}}@keyframes near{to{transform:scale(1.09) translateY(1%)}}@keyframes fall{to{background-position:0 190px,0 260px,0 280px}}@media(max-width:600px){main{padding:0}.stage{width:100vw;height:100svh;aspect-ratio:auto;border:0;border-radius:0}.stage img{content:url('forest-mobile.svg')}.note{display:none}}
</style><main><section class="stage"><img class="far" src="forest-desktop.svg" alt=""><div class="snow"></div></section></main><div class="note">Draft technical prototype — procedural vector artwork, not an approved final visual asset.</div></html>
