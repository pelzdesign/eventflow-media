name: OCR certificate references

on:
  workflow_dispatch:
  push:
    branches:
      - chore/certificate-reference-ocr
    paths:
      - ".github/workflows/ocr-certificate-references.yml"
      - ".run-visual-export"
      - "references/products/certificates/*.jpg"
      - "references/products/certificates/*.jpeg"
      - "references/products/certificates/*.png"
  pull_request:
    branches:
      - main
    paths:
      - "references/products/certificates/**"

permissions:
  contents: write

concurrency:
  group: certificate-reference-ocr
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out media library
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install free OCR engine and language data
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng python3-pil

      - name: Extract text from certificate reference images
        if: false # Temporarily skip OCR during visual-access experiment
        shell: bash
        run: |
          set -euo pipefail
          target="references/products/certificates"
          output="$target/OCR_EXTRACTION.md"
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT

          {
            echo "# OCR extraction — certificate reference materials"
            echo
            echo "- Generated: $(date -u +%F) (UTC)"
            echo "- Engine: Tesseract OCR"
            echo "- Languages: Russian + English"
            echo "- Source: original image files in this folder"
            echo "- Note: OCR is an aid to analysis; verify ambiguous names, numbers and punctuation against the original image."
            echo
          } > "$output"

          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            printf '## %s\n\n' "$(basename "$file")" >> "$output"
            if tesseract "$file" stdout -l rus+eng --psm 11 2>/dev/null > "$temp"; then
              if [ -s "$temp" ]; then
                cat "$temp" >> "$output"
              else
                echo "_No readable text detected._" >> "$output"
              fi
            else
              echo "_OCR could not process this image._" >> "$output"
            fi
            printf '\n\n' >> "$output"
          done < <(find "$target" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | sort -z)

          if [ "$count" -eq 0 ]; then
            echo "No source images found in $target" >&2
            exit 1
          fi
          echo "Processed $count image(s)."
          rm -f "$target/.ocr-run-request.md"

      - name: Build a compact visual contact sheet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import base64, io
          folder = Path("references/products/certificates")
          files = sorted([p for p in folder.iterdir() if p.suffix.lower() in {".jpg", ".jpeg", ".png"}])
          cell_w, cell_h, label_h, cols = 240, 300, 30, 4
          rows = (len(files) + cols - 1) // cols
          sheet = Image.new("RGB", (cols * cell_w, rows * (cell_h + label_h)), "#f3f0eb")
          draw = ImageDraw.Draw(sheet)
          for i, path in enumerate(files):
              with Image.open(path) as source:
                  im = ImageOps.contain(source.convert("RGB"), (cell_w - 12, cell_h - 12))
              x, y = (i % cols) * cell_w, (i // cols) * (cell_h + label_h)
              sheet.paste(im, (x + (cell_w-im.width)//2, y + (cell_h-im.height)//2))
              draw.text((x + 8, y + cell_h + 5), path.name, fill="#29231d")
          out = io.BytesIO()
          sheet.save(out, format="JPEG", quality=58, optimize=True)
          encoded = base64.b64encode(out.getvalue()).decode("ascii")
          Path("/tmp/contact-sheet-base64.txt").write_text(encoded)
          Path("/tmp/contact-sheet-info.txt").write_text(f"files={len(files)}\\nsize={sheet.size}\\nbytes={len(out.getvalue())}\\n")
          print(Path("/tmp/contact-sheet-info.txt").read_text())
          PY
          cp /tmp/contact-sheet-base64.txt references/products/certificates/VISUAL_CONTACT_SHEET_BASE64.txt
          rm -f .run-visual-export

      - name: Commit extracted text to this branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A references/products/certificates/OCR_EXTRACTION.md references/products/certificates/.ocr-run-request.md
          if ! git diff --cached --quiet; then
            git commit -m "Add OCR extraction for certificate references"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
